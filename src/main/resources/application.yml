server:
  port: 8083
  servlet:
    context-path: /api/core

spring:
  application:
    name: ms-core-app

  # La conexion NO se define aca. Se toma del entorno:
  #   SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME, SPRING_DATASOURCE_PASSWORD
  #
  # Antes estaban escritas en este archivo, o sea que cualquiera con acceso al
  # repositorio tenia la base del negocio. Ademas habian quedado muertas:
  # apuntaban a un proyecto de Supabase que ya no existe.
  #
  # Debe ser el pooler en modo *session* (puerto 5432). Con el 6543 (transaction)
  # se pierde `app.tenant_id` entre consultas y Row-Level Security deja de aislar.
  datasource:
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 4
      minimum-idle: 1
      idle-timeout: 30000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: none
    # Apagados en produccion: este servicio maneja nomina, cartera y datos de
    # clientes, y con show-sql cada consulta contra employees, payrolls o
    # accounts_receivable termina en el log del proveedor. No filtra los valores
    # —Hibernate imprime los parametros como '?'— pero si publica el esquema
    # entero y multiplica el volumen de logs sin que nadie los lea.
    # El resto de los servicios ya los tenian en false; este era el unico
    # que no.
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        # Defensa en profundidad del aislamiento entre negocios.
        #
        # Con `@TenantId` en EntidadDeNegocio, Hibernate anade
        # `AND tenant_id = ?` al SQL de las 25 entidades. El valor lo da este
        # resolvedor, que lo lee de TenantContext.
        #
        # Se registra por propiedad y no con un HibernatePropertiesCustomizer:
        # el resolvedor no necesita nada de Spring —solo lee un ThreadLocal— y
        # asi Hibernate lo instancia el mismo. La version con customizer no
        # llegaba a aplicarse y el arranque fallaba con
        # "SessionFactory configured for multi-tenancy, but no tenant identifier
        # specified".
        #
        # SIN ESTA LINEA EL SERVICIO NO ARRANCA. No es opcional ni ajustable:
        # es lo que hace que @TenantId funcione.
        tenant_identifier_resolver: com.suresell.mscoreapp.infrastructure.multitenant.ResolvedorDeNegocioParaHibernate

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    try-it-out-enabled: true
    display-request-duration: true
  api-docs:
    path: /openapi
  show-actuator: true

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true

logging:
  level:
    root: INFO
    # INFO y no DEBUG: en produccion el nivel de depuracion de todo el paquete
    # solo genera ruido que esconde lo que importa. Para diagnosticar algo
    # puntual se sube por variable de entorno
    # (LOGGING_LEVEL_COM_SURESELL_MSCOREAPP=DEBUG) y se vuelve a bajar, sin
    # tocar el codigo.
    com.suresell.mscoreapp: INFO

# JWT del panel: el MISMO que emite ms-order-product al iniciar sesion, para no
# mantener dos sistemas de credenciales. Sin la variable el servicio NO arranca:
# es preferible a que quede abierto a internet, que es como estuvo hasta ahora.
security:
  jwt:
    secret: ${JWT_SECRET:}

# Ola 4 (A): interruptor del retiro del inventario viejo (supplies, supply-categories,
# supply-consumptions, shopping-list, supplier-requests, weekly-inventory). Con true,
# toda escritura a esas rutas responde 410 con el texto de adonde ir; las lecturas
# siguen. Por defecto false: la app de cocina todavia escribe ahi. Ver
# ModuloViejoDeInventarioSoloLectura.
inventario:
  viejo:
    solo-lectura: ${INVENTARIO_VIEJO_SOLO_LECTURA:false}
